<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港即時綜合 Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 16px;
            max-width: 650px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.5rem;
            color: #2c3e50;
        }
        header p {
            font-size: 0.85rem;
            color: #7f8c8d;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #2980b9;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .refresh-btn {
            background: none;
            border: none;
            color: #2980b9;
            cursor: pointer;
            font-size: 0.8rem;
        }
        /* 警告橫額 */
        .warning-banner {
            background: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        /* 天氣樣式 */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }
        .weather-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .weather-box .label {
            font-size: 0.75rem;
            color: #7f8c8d;
        }
        .weather-box .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #e67e22;
            margin-top: 4px;
        }
        .forecast-container {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 4px;
        }
        .forecast-item {
            background: #f8f9fa;
            min-width: 90px;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            flex-shrink: 0;
        }
        .forecast-date {
            font-size: 0.75rem;
            color: #7f8c8d;
        }
        .forecast-temp {
            font-size: 0.85rem;
            font-weight: bold;
            color: #34495e;
            margin-top: 4px;
        }
        /* 巴士樣式 */
        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f1f1;
        }
        .bus-item:last-child {
            border-bottom: none;
        }
        .bus-route {
            font-weight: bold;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            min-width: 55px;
            text-align: center;
        }
        .route-kmb { background: #d35400; }
        .route-lwb { background: #e67e22; }
        .route-ctb { background: #f1c40f; color: #333 !important; }
        
        .bus-dest {
            flex-grow: 1;
            margin-left: 10px;
            font-size: 0.85rem;
            color: #34495e;
        }
        .bus-time {
            font-weight: bold;
            color: #27ae60;
            font-size: 0.9rem;
        }
        /* 新聞樣式 */
        .news-item {
            padding: 10px 0;
            border-bottom: 1px solid #f1f1f1;
        }
        .news-item:last-child {
            border-bottom: none;
        }
        .news-item a {
            text-decoration: none;
            color: #2c3e50;
            font-size: 0.85rem;
            font-weight: 500;
            display: block;
        }
        .news-item a:hover {
            color: #2980b9;
        }
        .news-time {
            font-size: 0.75rem;
            color: #95a5a6;
            margin-top: 2px;
        }
        .loading {
            text-align: center;
            color: #95a5a6;
            font-size: 0.85rem;
            padding: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🇭🇰 香港即時綜合 Dashboard</h1>
        <p id="update-time">最後更新：載入中...</p>
    </header>

    <!-- 天氣警告橫額 -->
    <div id="warning-banner" class="warning-banner"></div>

    <!-- 天氣卡片 -->
    <div class="card">
        <h2>
            <span>🌤️ 天氣與五天預報</span>
            <button class="refresh-btn" onclick="fetchAllData()">重新整理</button>
        </h2>
        <div id="weather-content" class="loading">正在取得天氣資料...</div>
        <div style="font-size: 0.8rem; color: #7f8c8d; margin-top: 10px; margin-bottom: 6px;">未來幾天氣溫預報：</div>
        <div id="forecast-content" class="forecast-container">
            <div class="loading">載入預報中...</div>
        </div>
    </div>

    <!-- 巴士到站卡片 (九巴、龍運、城巴) -->
    <div class="card">
        <h2>
            <span>🚌 巴士到站預報 (九巴 / 龍運 / 城巴)</span>
        </h2>
        <div id="bus-content" class="loading">正在取得巴士資料...</div>
    </div>

    <!-- 新聞提要卡片 -->
    <div class="card">
        <h2>
            <span>📰 香港新聞提要 (RTHK)</span>
        </h2>
        <div id="news-content" class="loading">正在取得新聞資料...</div>
    </div>

    <script>
        window.onload = function() {
            fetchAllData();
            setInterval(fetchAllData, 60000); // 每 60 秒更新
        };

        function fetchAllData() {
            const now = new Date();
            document.getElementById('update-time').innerText = `最後更新：${now.toLocaleTimeString()}`;
            fetchWeatherAndWarnings();
            fetchForecast();
            fetchBusData();
            fetchNews();
        }

        // 1. 天氣即時與警告
        async function fetchWeatherAndWarnings() {
            const weatherDiv = document.getElementById('weather-content');
            const warningBanner = document.getElementById('warning-banner');
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                const temps = data.temperature.data;
                let tempVal = "N/A";
                let placeName = "香港";
                if (temps && temps.length > 0) {
                    const target = temps.find(i => i.place === "香港天文台") || temps[0];
                    tempVal = target.value + " °C";
                    placeName = target.place;
                }
                const humidityVal = data.humidity.data && data.humidity.data.length > 0 ? data.humidity.data[0].value + " %" : "N/A";

                weatherDiv.innerHTML = `
                    <div class="weather-grid">
                        <div class="weather-box">
                            <div class="label">測量點 (${placeName})</div>
                            <div class="value">${tempVal}</div>
                        </div>
                        <div class="weather-box">
                            <div class="label">相對濕度</div>
                            <div class="value">${humidityVal}</div>
                        </div>
                    </div>
                `;

                const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const warnData = await warnRes.json();
                let activeWarnings = [];
                for (let key in warnData) {
                    if (warnData[key].details && warnData[key].details.length > 0) {
                        activeWarnings.push(key);
                    }
                }
                if (activeWarnings.length > 0) {
                    warningBanner.style.display = 'block';
                    warningBanner.innerText = `⚠️ 天氣警告生效中 (請參閱天文台最新公報)`;
                } else {
                    warningBanner.style.display = 'none';
                }
            } catch (e) {
                weatherDiv.innerHTML = `<div class="loading" style="color:red;">天氣資料載入失敗</div>`;
            }
        }

        // 2. 天氣預報
        async function fetchForecast() {
            const forecastDiv = document.getElementById('forecast-content');
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const data = await res.json();
                
                if (data.weatherForecast && data.weatherForecast.length > 0) {
                    let html = '';
                    data.weatherForecast.slice(0, 5).forEach(day => {
                        const dateStr = day.forecastDate.substring(4, 6) + '/' + day.forecastDate.substring(6, 8);
                        const weekStr = day.week;
                        const minT = day.forecastMintemp.value;
                        const maxT = day.forecastMaxtemp.value;
                        html += `
                            <div class="forecast-item">
                                <div class="forecast-date">${dateStr} (${weekStr})</div>
                                <div class="forecast-temp">${minT}° - ${maxT}°C</div>
                            </div>
                        `;
                    });
                    forecastDiv.innerHTML = html;
                }
            } catch (e) {
                forecastDiv.innerHTML = `<div class="loading">預報載入失敗</div>`;
            }
        }

        // 3. 巴士到站 (九巴/龍運/城巴)
        async function fetchBusData() {
            const busDiv = document.getElementById('bus-content');
            let html = '';
            try {
                // 九巴 / 龍運站點示範
                const kmbRes = await fetch('https://etabus.gov.hk/v1/transport/kmb/stop-eta/6B85E6E342B6A562');
                const kmbData = await kmbRes.json();
                if (kmbData.data && kmbData.data.length > 0) {
                    kmbData.data.slice(0, 3).forEach(eta => {
                        const route = eta.route;
                        const dest = eta.dest_tc;
                        const isLWB = route.startsWith('A') || route.startsWith('E') || route.startsWith('NA') || route.startsWith('S');
                        const badgeClass = isLWB ? 'route-lwb' : 'route-kmb';
                        const badgeText = isLWB ? '龍運' : '九巴';
                        
                        let timeStr = "暫無班次";
                        if (eta.eta) {
                            const diffMin = Math.round((new Date(eta.eta) - new Date()) / 60000);
                            timeStr = diffMin <= 0 ? "即將到達" : `${diffMin} 分鐘`;
                        }
                        html += `
                            <div class="bus-item">
                                <span class="bus-route ${badgeClass}">${route}</span>
                                <span class="bus-dest">往 ${dest} (${badgeText})</span>
                                <span class="bus-time">${timeStr}</span>
                            </div>
                        `;
                    });
                }

                // 城巴站點示範
                const ctbRes = await fetch('https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/001140');
                const ctbData = await ctbRes.json();
                if (ctbData.data && ctbData.data.length > 0) {
                    ctbData.data.slice(0, 2).forEach(eta => {
                        let timeStr = "暫無班次";
                        if (eta.eta) {
                            const diffMin = Math.round((new Date(eta.eta) - new Date()) / 60000);
                            timeStr = diffMin <= 0 ? "即將到達" : `${diffMin} 分鐘`;
                        }
                        html += `
                            <div class="bus-item">
                                <span class="bus-route route-ctb">${eta.route}</span>
                                <span class="bus-dest">往 ${eta.destTc || '市區'} (城巴)</span>
                                <span class="bus-time">${timeStr}</span>
                            </div>
                        `;
                    });
                }

                if (html === '') {
                    busDiv.innerHTML = `<div class="loading">目前無相關巴士班次</div>`;
                } else {
                    busDiv.innerHTML = html;
                }
            } catch (e) {
                busDiv.innerHTML = `<div class="loading" style="color:red;">巴士資料載入失敗</div>`;
            }
        }

        // 4. 新聞提要
        async function fetchNews() {
            const newsDiv = document.getElementById('news-content');
            try {
                const rssUrl = encodeURIComponent('https://rthk.hk/rthk/news/rss/c_expressnews.xml');
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
                const data = await res.json();

                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    let html = '';
                    data.items.slice(0, 4).forEach(item => {
                        const title = item.title;
                        const link = item.link;
                        const pubDate = new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        html += `
                            <div class="news-item">
                                <a href="${link}" target="_blank">${title}</a>
                                <div class="news-time">${pubDate}</div>
                            </div>
                        `;
                    });
                    newsDiv.innerHTML = html;
                } else {
                    newsDiv.innerHTML = `<div class="loading">暫時無法取得新聞</div>`;
                }
            } catch (e) {
                newsDiv.innerHTML = `<div class="loading" style="color:red;">新聞資料載入失敗</div>`;
            }
        }
    </script>
</body>
</html>
