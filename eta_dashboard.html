<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港即時資訊 Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 1.5rem;
            color: #2c3e50;
        }
        header p {
            font-size: 0.85rem;
            color: #7f8c8d;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #2980b9;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .refresh-btn {
            background: none;
            border: none;
            color: #2980b9;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .weather-info {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .weather-item div:first-child {
            font-size: 0.8rem;
            color: #7f8c8d;
        }
        .weather-item div:last-child {
            font-size: 1.3rem;
            font-weight: bold;
            color: #e67e22;
            margin-top: 4px;
        }
        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f1f1;
        }
        .bus-item:last-child {
            border-bottom: none;
        }
        .bus-route {
            font-weight: bold;
            background: #d35400;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .bus-dest {
            flex-grow: 1;
            margin-left: 12px;
            font-size: 0.9rem;
            color: #34495e;
        }
        .bus-time {
            font-weight: bold;
            color: #27ae60;
            font-size: 0.95rem;
        }
        .news-item {
            padding: 10px 0;
            border-bottom: 1px solid #f1f1f1;
        }
        .news-item:last-child {
            border-bottom: none;
        }
        .news-item a {
            text-decoration: none;
            color: #2c3e50;
            font-size: 0.9rem;
            font-weight: 500;
            display: block;
        }
        .news-item a:hover {
            color: #2980b9;
        }
        .news-time {
            font-size: 0.75rem;
            color: #95a5a6;
            margin-top: 4px;
        }
        .loading {
            text-align: center;
            color: #95a5a6;
            font-size: 0.9rem;
            padding: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🇭🇰 香港生活 Dashboard</h1>
        <p id="update-time">最後更新：載入中...</p>
    </header>

    <div class="card">
        <h2>
            <span>🌤️ 香港天文台天氣</span>
            <button class="refresh-btn" onclick="fetchAllData()">重新整理</button>
        </h2>
        <div id="weather-content" class="loading">正在取得天氣資料...</div>
    </div>

    <div class="card">
        <h2>
            <span>🚌 九巴即時到站</span>
        </h2>
        <div id="bus-content" class="loading">正在取得巴士資料...</div>
    </div>

    <div class="card">
        <h2>
            <span>📰 香港新聞提要 (RTHK)</span>
        </h2>
        <div id="news-content" class="loading">正在取得新聞資料...</div>
    </div>

    <script>
        window.onload = function() {
            fetchAllData();
            setInterval(fetchAllData, 60000);
        };

        function fetchAllData() {
            const now = new Date();
            document.getElementById('update-time').innerText = `最後更新：${now.toLocaleTimeString()}`;
            fetchWeather();
            fetchBus();
            fetchNews();
        }

        // 天氣
        async function fetchWeather() {
            const weatherDiv = document.getElementById('weather-content');
            try {
                const response = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await response.json();
                
                const temps = data.temperature.data;
                let tempVal = "N/A";
                let placeName = "香港";
                
                if (temps && temps.length > 0) {
                    const tsimShaTsui = temps.find(item => item.place === "香港天文台" || item.place === "尖沙咀本部");
                    const target = tsimShaTsui ? tsimShaTsui : temps[0];
                    tempVal = target.value + " °C";
                    placeName = target.place;
                }

                const humidityData = data.humidity.data;
                const humidityVal = humidityData && humidityData.length > 0 ? humidityData[0].value + " %" : "N/A";

                weatherDiv.innerHTML = `
                    <div class="weather-info">
                        <div class="weather-item">
                            <div>測量點 (${placeName})</div>
                            <div>${tempVal}</div>
                        </div>
                        <div class="weather-item">
                            <div>相對濕度</div>
                            <div>${humidityVal}</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                weatherDiv.innerHTML = `<div class="loading" style="color:red;">天氣資料載入失敗（請確認是否為瀏覽器阻擋）</div>`;
            }
        }

        // 巴士 (透過 AllOrigins 代理繞過本地跨域限制)
        async function fetchBus() {
            const busDiv = document.getElementById('bus-content');
            try {
                const targetUrl = 'https://etabus.gov.hk/v1/transport/kmb/stop-eta/6B85E6E342B6A562';
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(proxyUrl);
                const proxyData = await response.json();
                const data = JSON.parse(proxyData.contents);
                
                if (data.data && data.data.length > 0) {
                    let html = '';
                    const etas = data.data.slice(0, 4);
                    
                    etas.forEach(eta => {
                        const route = eta.route;
                        const dest = eta.dest_tc;
                        let timeStr = "暫無班次";
                        
                        if (eta.eta) {
                            const etaDate = new Date(eta.eta);
                            const diffMin = Math.round((etaDate - new Date()) / 60000);
                            timeStr = diffMin <= 0 ? "即將到達" : `${diffMin} 分鐘`;
                        }

                        html += `
                            <div class="bus-item">
                                <span class="bus-route">${route}</span>
                                <span class="bus-dest">往 ${dest}</span>
                                <span class="bus-time">${timeStr}</span>
                            </div>
                        `;
                    });
                    busDiv.innerHTML = html;
                } else {
                    busDiv.innerHTML = `<div class="loading">目前該站點無預定班次</div>`;
                }
            } catch (error) {
                busDiv.innerHTML = `<div class="loading" style="color:red;">巴士資料載入失敗</div>`;
            }
        }

        // 新聞
        async function fetchNews() {
            const newsDiv = document.getElementById('news-content');
            try {
                const rssUrl = encodeURIComponent('https://rthk.hk/rthk/news/rss/c_expressnews.xml');
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
                const data = await response.json();

                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    let html = '';
                    const items = data.items.slice(0, 4);
                    
                    items.forEach(item => {
                        const title = item.title;
                        const link = item.link;
                        const pubDate = new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                        html += `
                            <div class="news-item">
                                <a href="${link}" target="_blank">${title}</a>
                                <div class="news-time">${pubDate}</div>
                            </div>
                        `;
                    });
                    newsDiv.innerHTML = html;
                } else {
                    newsDiv.innerHTML = `<div class="loading">暫時無法取得新聞資料</div>`;
                }
            } catch (error) {
                newsDiv.innerHTML = `<div class="loading" style="color:red;">新聞資料載入失敗</div>`;
            }
        }
    </script>
</body>
</html>
